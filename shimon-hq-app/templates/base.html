<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Pinta HQ{% endblock %}</title>
<meta name="theme-color" content="#1F3A5F">
<link rel="manifest" href="/manifest.webmanifest?v={{ css_v }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}?v={{ css_v }}">
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}?v={{ css_v }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Our own stylesheet first, and the web fonts without blocking the first paint.
     On a phone this is the difference between the board appearing and the screen
     staying white while Google is asked for a font. -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_v }}">
<link id="webfonts" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap"
      onload="this.media='all'" onerror="this.media='all'">
<script>
// Belt and braces: if the onload above never fires - a slow network, a blocked
// request, a cached sheet - promote the fonts once the page is up anyway. If
// Google is unreachable entirely the fallback stack simply stands, which is the
// behaviour we want on a phone with one bar.
addEventListener('load', function () {
  var l = document.getElementById('webfonts');
  if (l && l.media !== 'all') { l.media = 'all'; }
});
</script>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap"></noscript>
</head>
<body class="{{ 'simple' if display_mode == 'simple' else '' }}">
{% block body %}{% endblock %}
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
// Six tabs no longer fit a phone, so the strip scrolls. Bring the tab you are
// actually on into view - setting scrollLeft directly, because scrollIntoView
// would drag the whole page with it.
(function () {
  var strip = document.querySelector('nav.tabs');
  var on = strip && strip.querySelector('.tab.on');
  if (!strip || !on) { return; }
  if (strip.scrollWidth > strip.clientWidth + 2) {
    strip.scrollLeft = Math.max(0, on.offsetLeft - (strip.clientWidth - on.offsetWidth) / 2);
  }
})();
</script>
{% block scripts %}{% endblock %}
<script src="{{ url_for('static', filename='gestures.js') }}?v={{ css_v }}"></script>
<script src="{{ url_for('static', filename='geo.js') }}?v={{ css_v }}"></script>
</body>
</html>
