<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Shimon HQ{% endblock %}</title>
<meta name="theme-color" content="#1F3A5F">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_v }}">
</head>
<body>
{% block body %}{% endblock %}
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
