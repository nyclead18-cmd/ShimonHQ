{% extends "base.html" %}
{% block title %}Sign in · {{ login_title|default(hq_title) }}{% endblock %}
{% block body %}
<div class="login-wrap">
  <form class="login-card" method="post" autocomplete="on">
    {% if has_logo %}<img class="loginlogo" src="{{ brand_url('logo.png') }}" alt="">{% endif %}
    <h1>{{ login_title|default(hq_title) }}</h1>
    {% if login_sub %}<div class="sub">{{ login_sub }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input name="username" placeholder="Username" autocapitalize="none" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
