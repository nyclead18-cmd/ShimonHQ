services:
  - type: web
    name: shimon-hq
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # One worker served one request at a time, so Joel opening the board could
    # sit behind Shimon loading the Pulse. Two workers, four threads each.
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 60 --graceful-timeout 30
    disk:
      name: hq-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/hq.db
      - key: SECRET_KEY
        generateValue: true
      - key: HQ_USER
        value: shimon
      - key: HQ_PASSWORD
        sync: false
